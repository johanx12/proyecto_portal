{% extends 'base.html' %}{% block content %}<section class="card narrow"><p class="eyebrow">TU ESPACIO DE ATENCIÓN</p><h1>{{ 'Crear cuenta' if register else 'Bienvenido de nuevo' }}</h1><form method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}">{% if register %}<label>Nombre<input name="name" autocomplete="name" required minlength="2" maxlength="80" value="{{ request.form.get('name','') }}"></label>{% endif %}<label>Correo electrónico<input type="email" name="email" autocomplete="email" required maxlength="120" value="{{ request.form.get('email','') }}"></label><label>Contraseña<input type="password" name="password" autocomplete="{{ 'new-password' if register else 'current-password' }}" required {% if register %}minlength="8" maxlength="128"{% endif %}></label><button>{{ 'Registrarme' if register else 'Ingresar' }}</button></form><p><a href="{{ url_for('login') if register else url_for('register') }}">{{ 'Ya tengo cuenta' if register else 'Crear una cuenta' }}</a></p></section>{% endblock %}
