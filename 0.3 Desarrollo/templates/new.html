{% extends 'base.html' %}{% block content %}<section class="card narrow"><p class="eyebrow">RECEPCIÓN DE SOLICITUDES</p><h1>Cuéntanos qué necesitas</h1><form method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}"><label>Asunto<input name="subject" required minlength="3" maxlength="120" value="{{ request.form.get('subject','') }}"></label><label>Categoría<select name="category">{% for cat in categories %}<option {% if request.form.get('category')==cat %}selected{% endif %}>{{ cat }}</option>{% endfor %}</select></label><label>Descripción<textarea name="description" rows="6" required minlength="10" maxlength="3000">{{ request.form.get('description','') }}</textarea></label><p>Al enviar guardamos tu solicitud en la base de datos y generamos un radicado.</p><button>Enviar solicitud</button></form></section>{% endblock %}
